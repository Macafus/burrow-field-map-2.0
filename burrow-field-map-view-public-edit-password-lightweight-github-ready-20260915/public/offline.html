<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>巣穴管理 - オフライン</title>
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #eef0ec;
        color: #20231f;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      }
      main {
        width: min(420px, calc(100vw - 32px));
        border: 1px solid #d5d9d1;
        border-radius: 8px;
        padding: 22px;
        background: #fffef8;
        box-shadow: 0 14px 36px rgba(32, 35, 31, 0.08);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 24px;
      }
      p {
        margin: 0 0 16px;
        color: #6c716a;
        line-height: 1.7;
      }
      a {
        color: #14534f;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>オフラインです</h1>
      <p>一度オンラインで開いた後は、保存済みの巣穴データをこの端末で表示できます。</p>
      <a href="/">巣穴管理を開く</a>
    </main>
  </body>
</html>
